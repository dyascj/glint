name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: cd app && cargo fmt --check
      - run: cd app && cargo clippy --all-targets -- -D warnings
      - run: cd app && cargo test
  # Glint is macOS-only; elsewhere the build must stop at one clear message.
  other-platforms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          cd app
          if cargo check 2> err.txt; then echo "::error::expected the macOS-only guard to stop the build"; exit 1; fi
          grep -q "only builds on macOS" err.txt || { cat err.txt; exit 1; }
